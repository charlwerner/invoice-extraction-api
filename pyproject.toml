[project]
name = "invoice-extraction-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Charl", email = "275422704+charlwerner@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.146.0",
    "pypdf>=6.21.2",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.mypy]
strict = true

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
